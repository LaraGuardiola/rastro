<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Demo · Checkout con iframes</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; background: #f4f4f8; margin: 0; padding: 32px 16px; color: #222; }
  main { max-width: 560px; margin: auto; background: #fff; padding: 24px 28px; border-radius: 14px; box-shadow: 0 4px 24px #0001; }
  h1 { margin-top: 0; font-size: 22px; }
  .f { margin-bottom: 14px; display: flex; flex-direction: column; gap: 4px; }
  label { font-weight: 600; font-size: 13px; }
  input { font: inherit; padding: 8px 10px; border: 1px solid #ccd; border-radius: 8px; }
  iframe { width: 100%; border: 1px dashed #b9b3e6; border-radius: 10px; }
  .note { font-size: 12px; color: #777; margin: 4px 0 8px; }
  #estado { margin-top: 14px; padding: 10px; border-radius: 8px; background: #f0f0f6; }
  #estado.ok { background: #e8fbef; color: #146c2e; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Checkout</h1>
  <div class="f"><label for="direccion">Dirección de envío</label><input id="direccion" name="direccion" /></div>
  <p class="note">↓ Pasarela de pago en otro origen (127.0.0.1), con el CVC en un iframe anidado</p>
  <iframe id="pasarela" name="pasarela" title="Pago seguro" src="http://127.0.0.1:4321/pago.html?session=abc123" height="290"></iframe>
  <p class="note">↓ iframe srcdoc (about:srcdoc)</p>
  <iframe id="newsletter" title="Newsletter" height="70" srcdoc="<body style='font:14px system-ui;margin:10px'><label><input type='checkbox' id='news'> Quiero recibir ofertas</label></body>"></iframe>
  <div id="estado">Pendiente de pago</div>
</main>
<script>
  addEventListener("message", (e) => {
    if (e.origin === "http://127.0.0.1:4321" && e.data?.pago === "ok") {
      const el = document.getElementById("estado");
      el.textContent = `Pedido confirmado · tarjeta ····${e.data.last4}`;
      el.className = "ok";
    }
  });
</script>
</body>
</html>
